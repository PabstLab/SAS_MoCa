config:
   datafile:  "./POPC_50C_Symmetry2021.dat"  # POPC LUV dataset; see [Frewein et al., Symmetry 2021, DOI:10.3390/sym13081441]
   save-folder: "POPC-example"
   qrange: [0.005, 0.6]
   model: LUV_POPC
   temperature-init: 500
   target-X2: 1
   data-binning: 1
   error-scale: 1
   iterations: 100
   processes: 24
   plot-only: off

# Name:	[ initialization, fixed=off / free=on, prior->relative standard deviation, low & high limits ]
parameters:
    #	Vesicle's parameters
    Norm: [0.0000001, off, Null, 0.00000001, 1] # Normalization
    nv: [1.0, on, Null, 0.1, 2.5] # Vesicle concencentration x10^7 (AA^-3)
    Rv: [450, on, 0.1, Null, Null] # Vesicle radius (AA)
    Z: [10, on, Null, 5.1, 18] # Vesicle poldispersity
    #	Head-group Positions & Widths
    d_Chol: [4.3, on, 0.03, Null, Null] # CholCH3 position (AA)
    s_Chol: [3.0, on, 0.02, Null, Null] # CholCH3 width (AA)
    d_PCN: [4.3, on, 0.08, Null, Null] # PCN position (AA)
    s_PCN: [2.5, on, 0.2, Null, Null] # PCN width (AA)
    d_CG: [0.8, on, 0.08, Null, Null] # CG position (AA)
    s_CG: [2.5, on, 0.2, Null, Null] # CG width (AA)
    #	Acyl chain Positions & Widths
    dD_C: [28.4, on, 0.03, Null, Null] # Hydrocarbon thickness 2Dc (AA)
    r_D_C: [0.079, on, 0.06, Null, Null] #	relative Dc std
    s_CH2: [2.48, on, 0.05, Null, Null] # HC smearing (AA)
    d_CH: [9.0, off, Null, 8, 10] # CH position (AA)
    s_CH: [3.05, off, 0.02, Null, Null] #	CH width (AA)
    s_CH3: [3.40, on, 0.05, Null, Null] #	CH3 width (AA)
    #	Area & Volumes
    r_PCN: [0.300, on, 0.05, Null, Null] # V_PCN/V_H
    r_CG: [0.410, on, 0.05, Null, Null] # V_GG/V_H
    r12: [0.80, off, 0.05, 0.73, 0.89] # V_CH/V_CH2
    r32: [1.93, on, 0.05, Null, Null] #	V_CH3/V_CH2
    T: [50, off, Null, 32, 52] # Temperature (°C)
    V_H: [324, on, 0.02, Null, Null] # Lipid-head volume (AA³)
    V_BW: [29.9, on, 0.06, 28.5, 31.5] # Bound-water volume (AA³)
    #
    Con: [0.0005, on, Null, 0.0003, 0.0007] # Constant (AA⁻¹)
